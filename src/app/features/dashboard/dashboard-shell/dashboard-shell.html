<div class="flex min-h-screen bg-slate-50">
  <aside class="flex w-64 shrink-0 flex-col bg-sidebar text-slate-300">
    <div class="flex items-center gap-2 px-5 py-5">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white">📅</span>
      <span class="text-lg font-bold text-white">Slotify</span>
    </div>

    @if (business(); as biz) {
      <a
        routerLink="/dashboard/business-profile"
        class="mx-3 mb-4 flex items-center gap-3 rounded-xl border border-sidebar-border px-3 py-2.5 hover:bg-sidebar-hover"
      >
        <app-avatar [name]="biz.name" size="sm" />
        <span class="truncate text-sm font-semibold text-white">{{ biz.name }}</span>
      </a>
    }

    <nav class="flex-1 space-y-1 px-3">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-sidebar-active text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white"
        >
          <span>{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="space-y-1 border-t border-sidebar-border px-3 py-3">
      <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Quick access</p>
      @if (business(); as biz) {
        <a
          [routerLink]="['/book', biz.slug]"
          target="_blank"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white"
        >
          <span>🔗</span>
          Booking page
        </a>
      }
    </div>

    <div class="space-y-1 border-t border-sidebar-border px-3 py-3">
      <a
        routerLink="business-profile"
        routerLinkActive="bg-sidebar-active text-white"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white"
      >
        <span>⚙️</span>
        Settings
      </a>
      <button
        type="button"
        (click)="signOut()"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium hover:bg-sidebar-hover hover:text-white"
      >
        <span>↪</span>
        Sign out
      </button>
    </div>

    @if (auth.currentUser(); as user) {
      <div class="flex items-center gap-3 border-t border-sidebar-border px-5 py-4">
        <app-avatar [name]="user.username" size="sm" />
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-white">{{ user.username }}</p>
          <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
        </div>
      </div>
    }
  </aside>

  <main class="min-w-0 flex-1 overflow-y-auto p-8">
    <router-outlet />
  </main>
</div>
