<app-modal [open]="open()" [title]="service() ? 'Edit service' : 'Add service'" (close)="closed.emit()">
  <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="svc-name" class="block text-sm font-medium text-slate-700">Name</label>
      <input
        id="svc-name"
        type="text"
        formControlName="name"
        class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
      />
      <app-field-error [control]="form.controls.name" />
    </div>

    <div>
      <label for="svc-description" class="block text-sm font-medium text-slate-700">Description</label>
      <textarea
        id="svc-description"
        rows="2"
        formControlName="description"
        class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
      ></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="svc-duration" class="block text-sm font-medium text-slate-700">Duration (min)</label>
        <input
          id="svc-duration"
          type="number"
          formControlName="duration_minutes"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        />
        <app-field-error [control]="form.controls.duration_minutes" />
      </div>
      <div>
        <label for="svc-buffer" class="block text-sm font-medium text-slate-700">Buffer (min)</label>
        <input
          id="svc-buffer"
          type="number"
          formControlName="buffer_minutes"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        />
        <app-field-error [control]="form.controls.buffer_minutes" />
      </div>
    </div>

    <div>
      <label for="svc-price" class="block text-sm font-medium text-slate-700">Price ($)</label>
      <input
        id="svc-price"
        type="number"
        step="0.01"
        formControlName="price"
        class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
      />
      <app-field-error [control]="form.controls.price" />
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input type="checkbox" formControlName="is_active" class="rounded border-slate-300 text-brand-600" />
      Active (visible on the public booking page)
    </label>

    <div class="flex justify-end gap-3 pt-2">
      <app-button type="button" variant="outline" (click)="closed.emit()">Cancel</app-button>
      <app-button type="submit" [loading]="saving()">Save service</app-button>
    </div>
  </form>
</app-modal>
