<app-modal [open]="open()" [title]="staffMember() ? 'Edit staff member' : 'Invite staff member'" (close)="closed.emit()">
  <form class="space-y-4" [formGroup]="createForm" (ngSubmit)="submit()">
    @if (!staffMember()) {
      <div>
        <label for="staff-username" class="block text-sm font-medium text-slate-700">Username</label>
        <input
          id="staff-username"
          type="text"
          formControlName="username"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        />
        <app-field-error [control]="createForm.controls.username" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="staff-first" class="block text-sm font-medium text-slate-700">First name</label>
          <input
            id="staff-first"
            type="text"
            formControlName="first_name"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="createForm.controls.first_name" />
        </div>
        <div>
          <label for="staff-last" class="block text-sm font-medium text-slate-700">Last name</label>
          <input
            id="staff-last"
            type="text"
            formControlName="last_name"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="createForm.controls.last_name" />
        </div>
      </div>

      <div>
        <label for="staff-email" class="block text-sm font-medium text-slate-700">Email</label>
        <input
          id="staff-email"
          type="email"
          formControlName="email"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        />
        <app-field-error [control]="createForm.controls.email" />
      </div>

      <div>
        <label for="staff-password" class="block text-sm font-medium text-slate-700">Temporary password</label>
        <input
          id="staff-password"
          type="password"
          formControlName="password"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        />
        <app-field-error [control]="createForm.controls.password" />
      </div>
    }

    <div>
      <p class="block text-sm font-medium text-slate-700">Services offered</p>
      <div class="mt-2 space-y-1.5">
        @for (service of services(); track service.id) {
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input
              type="checkbox"
              [checked]="isServiceSelected(service.id)"
              (change)="toggleService(service.id, $any($event.target).checked)"
              class="rounded border-slate-300 text-brand-600"
            />
            {{ service.name }}
          </label>
        }
      </div>
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input type="checkbox" formControlName="is_active" class="rounded border-slate-300 text-brand-600" />
      Active
    </label>

    <div class="flex justify-end gap-3 pt-2">
      <app-button type="button" variant="outline" (click)="closed.emit()">Cancel</app-button>
      <app-button type="submit" [loading]="saving()">Save</app-button>
    </div>
  </form>
</app-modal>
