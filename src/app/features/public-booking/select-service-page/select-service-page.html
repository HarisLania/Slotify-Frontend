<div>
  <h1 class="text-2xl font-bold text-slate-900">Choose a service</h1>
  <p class="mt-1 text-slate-500">What are you looking for today?</p>

  @if (services.length === 0) {
    <div class="mt-6">
      <app-empty-state title="No services available" description="This business hasn't published any bookable services yet." />
    </div>
  } @else {
    <div class="mt-6 space-y-3">
      @for (service of services; track service.id) {
        <button
          type="button"
          (click)="choose(service)"
          class="flex w-full items-center justify-between rounded-xl border border-slate-200 bg-white p-5 text-left hover:border-brand-400 hover:shadow-sm"
        >
          <div class="flex items-center gap-4">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand-50 text-brand-600">🕒</span>
            <div>
              <h3 class="font-semibold text-slate-900">{{ service.name }}</h3>
              @if (service.description) {
                <p class="text-sm text-slate-500">{{ service.description }}</p>
              }
              <p class="text-sm text-slate-400">{{ service.duration_minutes }} min</p>
            </div>
          </div>
          <span class="text-lg font-bold text-slate-900">{{ formatMoney(service.price) }}</span>
        </button>
      }
    </div>
  }
</div>
