<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-100 bg-white">
    <div class="mx-auto max-w-3xl px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          @if (showBack()) {
            <button type="button" (click)="goBack()" class="text-slate-500 hover:text-slate-800" aria-label="Back">←</button>
          }
          <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white">📅</span>
          <span class="font-bold text-slate-900">{{ slug }}</span>
        </div>
      </div>

      @if (showStepper()) {
        <div class="mt-4">
          <app-stepper [steps]="STEP_LABELS" [activeIndex]="currentStepIndex()" />
        </div>
      }
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-8">
    @if (loading()) {
      <app-spinner />
    } @else if (loadError()) {
      <div class="rounded-xl border border-dashed border-slate-300 py-16 text-center">
        <h1 class="text-lg font-semibold text-slate-900">We couldn't load this booking page</h1>
        <p class="mt-1 text-sm text-slate-500">Double-check the link, or try again in a moment.</p>
      </div>
    } @else {
      <router-outlet />
    }
  </main>
</div>
