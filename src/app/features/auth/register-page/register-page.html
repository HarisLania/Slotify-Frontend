<div class="flex min-h-screen">
  <aside class="hidden w-1/3 flex-col justify-between bg-brand-600 p-10 text-white lg:flex">
    <a routerLink="/" class="flex items-center gap-2">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/15">📅</span>
      <span class="text-lg font-bold">Slotify</span>
    </a>
    <p class="text-2xl font-semibold leading-snug">
      Set up your business and start taking bookings in minutes.
    </p>
    <span></span>
  </aside>

  <main class="flex flex-1 flex-col items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">
      <a routerLink="/" class="mb-8 flex items-center gap-2 lg:hidden">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white">📅</span>
        <span class="text-lg font-bold text-slate-900">Slotify</span>
      </a>

      <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
      <p class="mt-1 text-sm text-slate-500">Start booking appointments in minutes</p>

      <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="alexlee"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.username" />
        </div>

        <div>
          <label for="businessName" class="block text-sm font-medium text-slate-700">Business name</label>
          <input
            id="businessName"
            type="text"
            formControlName="businessName"
            placeholder="Bloom Salon"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.businessName" />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@business.com"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.email" />
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700">
            Phone <span class="font-normal text-slate-400">(optional)</span>
          </label>
          <input
            id="phone"
            type="tel"
            formControlName="phone"
            autocomplete="tel"
            placeholder="+1 (555) 000-0000"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.phone" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Min. 8 characters"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.password" />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm password</label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Re-enter your password"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
          />
          <app-field-error [control]="form.controls.confirmPassword" />
        </div>

        <app-button type="submit" variant="accent" full [loading]="submitting()">Create free account</app-button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account? <a routerLink="/login" class="font-semibold text-brand-600">Log in</a>
      </p>
    </div>
  </main>
</div>
